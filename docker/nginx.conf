worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Main Dashboard & API Proxy (Port 80 and Port 5173)
    server {
        listen 80;
        listen 5173;
        server_name _;

        client_max_body_size 500M;

        # Frontend Dashboard Static Dist
        location / {
            root /var/www/vcc/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Training Studio Isolated UI
        location /training-studio {
            root /var/www/vcc/dist;
            index training.html;
            try_files $uri $uri/ /training.html;
        }

        # Backend REST API & Auth
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:8000/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://127.0.0.1:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        location /health {
            proxy_pass http://127.0.0.1:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # MJPEG Camera Streams & Raw Snapshots
        location /stream/ {
            proxy_pass http://127.0.0.1:8001/stream/;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
        }

        location /snapshot/ {
            proxy_pass http://127.0.0.1:8001/snapshot/;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
        }

        location /raw_snapshot/ {
            proxy_pass http://127.0.0.1:8001/raw_snapshot/;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
        }
    }

    # Isolated Training Studio UI Server (Port 5174)
    server {
        listen 5174;
        server_name _;

        client_max_body_size 500M;

        location / {
            root /var/www/vcc/dist;
            index training.html;
            try_files $uri $uri/ /training.html;
        }

        location /api/training/ {
            proxy_pass http://127.0.0.1:8002/api/training/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /auth/ {
            proxy_pass http://127.0.0.1:8000/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws {
            proxy_pass http://127.0.0.1:8000/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /snapshot/ {
            proxy_pass http://127.0.0.1:8001/snapshot/;
            proxy_buffering off;
        }

        location /raw_snapshot/ {
            proxy_pass http://127.0.0.1:8001/raw_snapshot/;
            proxy_buffering off;
        }
    }
}
